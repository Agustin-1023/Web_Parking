name: CI/CD Pipeline - Web Parking

on:
  push:
    branches: [ main ]

jobs:
  testing:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.BD_PASSWORD }}
          MYSQL_DATABASE: parking_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Esperar disponibilidad de MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 --silent; do
            echo "Esperando a que MySQL inicie..."
            sleep 2
          done
          echo "MySQL listo para conexiones."

      - name: Cargar esquema de Base de Datos (Si tienes un script .sql)
        run: |
          if [ -f schema.sql ]; then
            mysql -h 127.0.0.1 -P 3306 -u root -p"${{ secrets.BD_PASSWORD }}" parking_test_db < schema.sql
          fi

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests con Jest
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ${{ secrets.BD_PASSWORD }}
          DB_NAME: parking_test_db
          DB_PORT: 3306
        run: npm test -- --testTimeout=15000 --detectOpenHandles --forceExit

  deploy:
    needs: testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Actualizar servidor por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          password: ${{ secrets.RPI_PASSWORD }}
          script: |
            cd /home/labastin/Web_Parking
            git pull origin main
            npm install --production
            pm2 restart all || pm2 start server.js --name "web-parking"
