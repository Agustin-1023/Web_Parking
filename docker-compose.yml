version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: parking_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${BD_PASSWORD:-db_test123}
      MYSQL_DATABASE: ${DB_NAME:-parking_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    
  app:
     build: .
     container_name: parking_app
     restart: always
     ports:
       - "9000:9000"
     volumes:
       - .:/app
       - /app/node_modules
     command: npm run start
     environment:
       PORT: 9000
       DB_HOST: db
       DB_USER: root
       DB_PASSWORD: ${BD_PASSWORD:-db_test123}
       DB_NAME: ${DB_NAME:-parking_db}
       DB_PORT: 3306
       CHOKIDAR_USERPOLLING: "true"
       WATHPACK_POLLING: "true"
     depends_on:
       - db
volumes:
  mysql_data:
