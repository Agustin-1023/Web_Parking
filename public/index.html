<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>LOGIN - Parcking</title>
	<link rel="stylesheet"  type="text/css" 
	href="./css/master.css">
</head>
<body>
	 <div class="login-box">
	 	<img class="avatar" src="assets/imagen 1.jpeg" alt="Logo de Parcking">
	 	<h1>LOGGIN</h1>
		<form id="FormularioLogin">
	 		<!-- username-->
	 		<div class="login-box-user,pass">
	 			<!--icon-people-->
	 			<img class="icon-people" src="assets/svg/user.svg" alt="">
	 			<input type="text" id="user-name" name="user-name" placeholer="Ingresar usuario"> <br>
	 		<!-- user pass-->
	 			<img class="icon-key" src="assets/svg/key.svg" alt="">
	 			<input type="Password" id="user-Password"  name="user-Password" placeholder="Ingresar Password">
	 		</div>
	 		<div class="button">
	 			<input type="submit" value="INGRESAR"><br>
	 		</div>
	 		<div class="lost-pass-submit">
	 			<a href="#">Olvide mi password</a> <br>
	 			<a href=".\Registros.html">No estoy registrado</a>
	 		</div>
	 	</form>
	 </div>

</body>
		<script src="./js/index.js" defer></script>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</html>
