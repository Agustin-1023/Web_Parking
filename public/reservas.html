<!DOCTYPE html>
<html leng="es">
<head>
	<meta charset="utf-8">
	<title>ADMIN RESERVAS</title>
	<link rel="stylesheet" type="text/css" href="./css/admin_parking.css">
	<link rel="stylesheet" type="text/css" href="./css/reservas.css">
</head>
<body>
	<aside class="sidebar">
		<ul class="sidebar-menu">
		<div class="sidebar-header">
			<h3>Administracion</h3>
		</div>	
			<ul class="sidebar-menu">
				<li><a href="#">Estadisticas</a></li>
				<li><a href="reservas.html" class="active">Reservas</a></li>
				<li><a href="admin_lugar.html">Lugares</a></li>
				<li><a href="admin_piso.html">Pisos</a></li>
				<li><a href="#">Usuarios</a></li>
				<li><a href="admin_paking.html">Estacionamiento</a></li>
				<li><a href="#">Reportes</a></li>
				<li><a href="#">Configuraciones</a></li>
				<li><a href="#">Administradores</a></li>
				<li><a href="#">Cerrar Sesion</a></li>
			</ul>
	</aside>
	<div class="main-admin">
		<h1>PANEL DE GESTION DE RESERVAS</h1>

		<div class="top-controls">
			<div class="filter-group">
				<label for="select-estacionamiento-filtro"><strong>Estacionamiento:</strong></label>
				<select id="select-estacionamiento-filtro">
					<option value="todos">Todos Los Estacionamientos</option>
				</select>
				<label for="select-estado-filtro"><strong>Estado:</strong></label>
				<select id="select-estado-filtro">
					<option value="todos">Todos los estados</option>
					<option value="activa">Activa</option>
					<option value="Completada">Completada</option>
					<option value="cancelada">Cancelada</option>
				</select>
			</div>
			<button id="button-create-top" class="btn-primary">NUEVA RESERVA</button>
		</div>
		<div id="form-container" class="form-card" style="display:none;">
			<h3 id="form-title">Nueva Reserva</h3>
			
		<div class="form-row">
			<div class="form-group">
				<label for="select-estacionamiento">Estacionamiento:</label>
				<select id="select-estacionamiento">
					<option value="">Selecciona un estacionamiento...</option>
				</select>
			</div>
			<div class="form-group">
				<label for="select-lugar">Lugar:</label>
				<select id="select-lugar">
					<option value="">Selecciona primero un estacionamiento...</option>
				</select>
			</div>
		</div>
		<div class="form-row">
			<div class="form-group">
				<label for="inputPatente">Matricula Vehiculo:</label>
				<label type="text" id="inputPatente" placeholder="ej: ABC 1234"></label>
			</div>
			<div class="form-group">
				<label for="selectOrigen">Origen Reserva:</label>
				<select id="selectOrigen">
					<option value="manual">Manual (Panel Admin)</option>
					<option value="web">Web</option>
					<option value="app">App Movil</option>
				</select>
			</div>
		</div>
		<div class="form-row">
			<div class="form-group">
				<label for="inputFechaInicio">Fecha/Hora Entrada:</label>
				<input type="datetime-local" id="inputFechaInicio">
			</div>
			<div class="form-group">
				<label for="inputFechaFin">Fecha/Hora Salida:</label>
				<input type="datetime-local" id="inputFechaFin">
			</div>
		</div>
		<div class="form-actions">
			<button id="btn-guardar-reserva" class="btn-action btn-success">GUARDAR</button>
			<button id="btn-cancelar-reserva" class="btn-action btn-secondary">CANCELAR</button>
		</div>
	</div>
	<select class="last-reservations">
		<h2>Listado de Reservas</h2>
		<table class="reservations-table">
			<thead>
				<tr>
					<th>Lugar / Estacionamiento</th>
					<th>Patente</th>
					<th>Entrada</th>
					<th>Salida</th>
					<th>Origen</th>
					<th>Estado</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody id="tbody-reservas"></tbody>
		</table>
	</select>
	</div>
</body>
</html>
