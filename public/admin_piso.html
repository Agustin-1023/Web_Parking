<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<title>ADMIN PISOS</title>
	<link rel="stylesheet" type="text/css" href="./css/admin_parking.css">
	<link rel="stylesheet" type="text/css" href="./css/admin_piso.css">
	<link rel="stylesheet" type="text/css" href="./css/admin_lugar.css">
</head>
<body>
	<aside class="sidebar">
		<div class="sidebar-header">
			<h3>Administracion</h3>
		</div>
		<ul class="sidebar-menu">
            <li><a href="#">Estadisticas</a></li>
            <li><a href="reservas.html">Reservas</a></li>
            <li><a href="admin_lugar.html">Lugares</a></li>
            <li><a href="admin_piso.html">Pisos</a></li>
            <li><a href="#">Usuarios</a></li>
            <li><a href="admin_paking.html">Estacionamiento</a></li>
            <li><a href="#">Reportes</a></li>
            <li><a href="#">Configuraciones</a></li>
            <li><a href="#">Administradores</a></li>
            <li><a href="#">Cerrar Sesion</a></li>
		</ul>
	</aside>

	<div class="main-admin">
		<h1>PANEL DE GESTION DE PISOS</h1>

		<div class="top-controls" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px;">
			<div class="filter-group" style="display: flex; align-items: center; gap: 10px; flex: 1;">
				<label for="select-estacionamiento-filtro"><strong>Estacionamiento:</strong></label>
				<select id="select-estacionamiento-filtro"  style="padding: 8px 12px; border-radius: 5px; border: 1px solid #ccc; max-width: 320px; width: 100%;">
					<option value="">Selecciona un estacionamiento...</option>
				</select>
			</div>
			<button id="button-create-top" class="btn-action" style="background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">CREAR PISO</button>
		</div>

		<div id="form-container" class="form-card" style="display:none;">			
			<h3 style="color: #1a154b; margin-bottom: 15px;"> Nuevo Piso</h3>
			<div class="form-group">

				<select id="select-estacionamiento" style="width: 100%">
					<option value="">Selecciona un estacionamiento...</option>
				</select>
			</div>
			<div class="form-group">
				<input type="number" id="numeroPiso" placeholder="Numero de piso">
				<input type="text" id="descripcionPiso" placeholder="Descripcion (ej: Piso 1)">
			</div>
			<div class="form-group" style="justify-content: flex-end;">
				<button id="btn-guardar-piso" class="btn-action">GUARDAR</button>
				<button id="btn-cancelar-piso" class="btn-action">CANCELAR</button>
			</div>
		</div>

		<section class="last-reservations">
			<h2>Listado de Pisos</h2>
			<table class="reservations-table">
				<thead>
					<tr>
						<th>Numero</th>
						<th>Descripcion</th>
						<th>Acciones</th>
					</tr>
				</thead>
				<tbody id="tbody-pisos">
				</tbody>
			</table>
		</section>

		<div class="buttons-parkins">
			
			<button id="button-edit-bottom">MODIFICAR</button>
			<button id="button-delete-bottom">ELIMINAR</button>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="./js/admin_piso.js"></script>
</body>

</html>
